  (function () {
    var dialog = document.querySelector('[data-search-dialog]');
    var opener = document.querySelector('[data-search-open]');
    var input = document.querySelector('[data-search-input]');
    var results = document.querySelector('[data-search-results]');
    if (!dialog || !opener || !input || !results) return;

    var index = null;
    var loading = null;

    function load() {
      if (index) return Promise.resolve(index);
      if (loading) return loading;
      loading = fetch('/search.json')
        .then(function (r) { return r.json(); })
        .then(function (data) { index = data; return data; })
        .catch(function () { index = []; return index; });
      return loading;
    }

    function score(item, terms) {
      var haystack = [item.title, item.description, item.tags.join(' '), item.categories.join(' ')]
        .join(' ')
        .toLowerCase();
      var ok = terms.every(function (t) { return haystack.indexOf(t) >= 0; });
      if (!ok) return -1;
      var s = 0;
      terms.forEach(function (t) {
        if (item.title.toLowerCase().indexOf(t) >= 0) s += 3;
        if (item.description.toLowerCase().indexOf(t) >= 0) s += 1;
      });
      return s;
    }

    function render(query) {
      var q = query.trim().toLowerCase();
      if (!q) {
        results.innerHTML = '<p class="search-hint">输入关键词开始搜索</p>';
        return;
      }
      var terms = q.split(/\s+/).filter(Boolean);
      var hits = (index || [])
        .map(function (item) { return { item: item, s: score(item, terms) }; })
        .filter(function (x) { return x.s >= 0; })
        .sort(function (a, b) { return b.s - a.s; })
        .slice(0, 8);

      if (!hits.length) {
        results.innerHTML = '<p class="search-empty">没有找到匹配的文章</p>';
        return;
      }

      results.innerHTML = hits
        .map(function (x, i) {
          var item = x.item;
          return (
            '<a class="search-item' + (i === 0 ? ' active' : '') + '" href="' + item.url + '">' +
            '<span class="search-item-title">' + escapeHtml(item.title) + '</span>' +
            (item.description ? '<span class="search-item-desc">' + escapeHtml(item.description) + '</span>' : '') +
            '<span class="search-item-meta">' + item.date + ' · ' + escapeHtml(item.categories.join(' / ') || '未分类') + '</span>' +
            '</a>'
          );
        })
        .join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function open() {
      dialog.showModal();
      load().then(function () { render(input.value); });
      setTimeout(function () { input.focus(); }, 30);
    }

    opener.addEventListener('click', open);

    input.addEventListener('input', function () { render(input.value); });

    input.addEventListener('keydown', function (e) {
      var items = Array.prototype.slice.call(results.querySelectorAll('.search-item'));
      if (!items.length) return;
      var current = items.findIndex(function (el) { return el.classList.contains('active'); });
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        var next = e.key === 'ArrowDown' ? (current + 1) % items.length : (current - 1 + items.length) % items.length;
        items.forEach(function (el) { el.classList.remove('active'); });
        items[next].classList.add('active');
        items[next].scrollIntoView({ block: 'nearest' });
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        window.location.href = items[Math.max(current, 0)].getAttribute('href');
      }
    });

    dialog.addEventListener('click', function (e) {
      if (e.target === dialog) dialog.close();
    });

    document.addEventListener('keydown', function (e) {
      var isTyping = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !isTyping)) {
        e.preventDefault();
        open();
      }
    });
  })();
