      s.setAttribute('data-loading', 'lazy');

    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(
        function (entries) {
          if (entries.some(function (e) { return e.isIntersecting; })) {
            io.disconnect();
            mount();
          }
        },
        { rootMargin: '400px 0px' }
      );
      io.observe(host);
    } else {
      mount();
    }
